<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertex spinner</title>
  <meta name="description" content="Just make anything spin!">
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <header>
    <h1>Vertex Spinner!</h1>
    <a href="index.html" class="back-button"><< Go Back</a>
  </header>
  <main class="center-child">
    <canvas id="renderCanvas" width="400" height="400"></canvas>
    <div>
      <label for="depthTesting">Depth Testing:</label>
      <input type="checkbox" name="depthTesting" id="depthTesting" onchange="ChangeDepthTesting()" checked>
    </div>
    <div>
      <label for="rotationSpeed">Rotation Speed:</label>
      <input type="range" name="rotationSpeed" id="rotationSpeed" min="0.0" max="2.0" step="0.1" value="1.0" oninput="ChangeRotationSpeed()">
    </div>
    <div>
      <label for="scale">Scale:</label>
      <input type="range" name="scale" id="scale" min="0.1" max="2.0" step="0.1" value="1.0" oninput="ChangeScale()">
    </div>
  </main>
  <footer>2026 - Jan Richter</footer>
</body>
</html>
